services:
  - type: web
    name: aegisscan-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_ID
        value: aegisscan/hazard-vision-v0.1
      - key: APP_VERSION
        value: 0.1.0-demo
    healthCheckPath: /api/health
    autoDeploy: true
